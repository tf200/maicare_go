services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "25432:5432"
    environment:
      POSTGRES_USER: maicare
      POSTGRES_PASSWORD: maicare
      POSTGRES_DB: maicare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maicare -d maicare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "26379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: maicare-backend:latest
    restart: unless-stopped
    env_file:
      - app.env
    ports:
      - "28080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
