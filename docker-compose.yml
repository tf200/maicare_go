services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: maicare
            POSTGRES_PASSWORD: maicare
            POSTGRES_DB: maicare
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U maicare -d maicare"]
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        build: .
        env_file:
            - app.env
        ports:
            - "8080:8080"
        depends_on:
            db:
                condition: service_healthy
